# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Page setting
lang: "zh-tw"
author:
  name: SyuanTsai
title: SyuanTsai's Blog

description: >- # this means to ignore newlines until "baseurl:"
  Syuan Tsai's GitHub.io personal webpage, documenting work notes.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://notes.tw-syuan.com" # the canonical base hostname and protocol
github_username:  SyuanTsai

# Theme settings
minima:
  skin: dark
  date_format: "%Y/%m/%d"
  social_links:
    - title: SyuanTsai Github
      icon: github
      url: "https://github.com/SyuanTsai"
    - title: SyuanTsai Linkedin
      icon: linkedin
      url: "https://www.linkedin.com/in/tw-syuan"

# Build settings
remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c
permalink: /:categories/:year/:month/:day/:title:output_ext
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Treat source line breaks as soft wraps. A blank line is required to start a new paragraph.
kramdown:
  hard_wrap: false

# Warning: @import is deprecated, but this is an official issue, so the warning is disabled.
# Documentation: https://github.com/jekyll/jekyll-sass-converter#usage
sass:
  quiet_deps: true

# Keep internal reference notes out of the published site.
exclude:
  - ReferenceDocument/
  - docs/
  - scripts/
  - tests/
