<header class="site-header">
  <div class="site-shell site-header__inner">
    <a class="site-brand" rel="author" href="{{ '/' | relative_url }}" aria-label="Syuan Notes 首頁">
      <span class="site-brand__mark" aria-hidden="true">S</span>
      <span>Syuan Notes</span>
    </a>

    <div class="site-header__actions">
      <nav class="site-navigation" aria-label="主要導覽">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首頁</a>
        <a href="{{ '/articles/' | relative_url }}"{% if page.url == '/articles/' %} aria-current="page"{% elsif page.layout == 'post' or page.layout == 'taxonomy' or page.layout == 'archive' or page.url == '/categories/' or page.url == '/tags/' or page.url == '/archives/' %} aria-current="location"{% endif %}>文章</a>
        <a href="{{ '/search/' | relative_url }}"{% if page.url == '/search/' %} aria-current="page"{% endif %}>搜尋</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>關於</a>
      </nav>

      <div class="theme-switch" role="group" aria-label="色彩模式">
        <button type="button" data-theme-option="system" aria-label="跟隨系統" aria-pressed="false" title="跟隨系統">◐</button>
        <button type="button" data-theme-option="light" aria-label="淺色模式" aria-pressed="false" title="淺色模式">☀</button>
        <button type="button" data-theme-option="dark" aria-label="深色模式" aria-pressed="false" title="深色模式">☾</button>
      </div>
    </div>
  </div>
</header>
