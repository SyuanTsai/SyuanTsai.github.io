<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var storageKey = "syuan-theme";
      var theme = "system";

      try {
        var savedTheme = window.localStorage.getItem(storageKey);
        if (savedTheme === "system" || savedTheme === "light" || savedTheme === "dark") {
          theme = savedTheme;
        }
      } catch (error) {
        theme = "system";
      }

      var supportsMatchMedia = typeof window.matchMedia === "function";
      var prefersDark = supportsMatchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.resolvedTheme = theme === "system"
        ? (prefersDark ? "dark" : "light")
        : theme;
    }());
  </script>
  {%- seo -%}
  {%- feed_meta -%}
  {%- if page.unlisted == true -%}
  <meta name="robots" content="noindex, nofollow, noarchive">
  {%- endif -%}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
