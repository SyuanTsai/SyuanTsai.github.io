---
layout: default
---

<div class="home-page">
  <section class="home-intro" aria-labelledby="home-title">
    <p class="home-intro__eyebrow">Syuan Tsai · Software Engineer</p>
    <h1 id="home-title">隨手筆記</h1>
    {%- if page.description -%}
      <p class="home-intro__description">{{ page.description | escape }}</p>
    {%- endif -%}
  </section>

  <section class="latest-posts" id="latest-articles" aria-labelledby="latest-posts-title">
    <div class="section-heading">
      <h2 id="latest-posts-title">最新文章</h2>
      <a class="section-heading__link" href="{{ '/articles/' | relative_url }}">查看全部文章 <span aria-hidden="true">→</span></a>
    </div>

    {%- assign latest_posts = site.posts | slice: 0, 5 -%}
    {%- include post-list.html posts=latest_posts heading_level=3 -%}
  </section>
</div>
