---
layout: default
---

<section class="article-index" aria-labelledby="article-index-title">
  <header class="page-intro">
    <p class="page-intro__eyebrow">Notes</p>
    <h1 id="article-index-title">{{ page.title | escape }}</h1>
    {%- if page.description -%}
      <p>{{ page.description | escape }}</p>
    {%- endif -%}
  </header>

  <nav class="discovery-nav" aria-label="文章探索方式">
    <a href="{{ '/categories/' | relative_url }}">依分類</a>
    <a href="{{ '/tags/' | relative_url }}">依標籤</a>
    <a href="{{ '/archives/' | relative_url }}">依月份</a>
    <a href="{{ '/search/' | relative_url }}">搜尋文章</a>
  </nav>

  {%- include post-list.html posts=site.posts heading_level=2 -%}
</section>
