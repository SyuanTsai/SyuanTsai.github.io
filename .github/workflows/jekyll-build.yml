name: Test Jekyll site

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with GitHub Pages
        uses: actions/jekyll-build-pages@v1

      - name: Verify internal references are not published
        run: test ! -d _site/ReferenceDocument
