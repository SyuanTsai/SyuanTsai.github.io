name: Test Jekyll site

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Test article validation
        run: python3 -m unittest discover -s tests -v

      - name: Validate article sources
        run: python3 scripts/validate_posts.py

      - name: Verify generated discovery page sources
        run: python3 scripts/generate_discovery_pages.py --check

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Build with GitHub Pages
        uses: actions/jekyll-build-pages@v1.0.13

      - name: Verify generated article SEO
        run: python3 scripts/verify_generated_seo.py _site

      - name: Verify taxonomy, archives, search, and redirects
        run: python3 scripts/verify_content_discovery.py _site

      - name: Verify unlisted article template preview
        run: python3 scripts/verify_unlisted_preview.py _site

      - name: Verify GitHub Pages delivery artifacts
        run: python3 scripts/verify_site_delivery.py _site

      - name: Verify deterministic quality baseline
        run: python3 scripts/verify_quality_baseline.py _site

      - name: Report external link status
        continue-on-error: true
        run: python3 scripts/verify_quality_baseline.py _site --external-only --external-report quality-reports/external-links.json

      - name: Capture Lighthouse mobile baseline
        continue-on-error: true
        run: |
          python3 -m http.server 4000 --directory _site >/tmp/syuan-notes-lighthouse.log 2>&1 &
          quality_server_pid=$!
          trap 'kill "$quality_server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          mkdir -p quality-reports
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4000/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --output=json \
            --output-path=quality-reports/lighthouse-mobile.json \
            --chrome-flags='--headless=new --no-sandbox'

      - name: Run blocking axe accessibility audit
        run: |
          python3 -m http.server 4000 --directory _site >/tmp/syuan-notes-axe.log 2>&1 &
          quality_server_pid=$!
          trap 'kill "$quality_server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          mkdir -p quality-reports
          npx --yes @axe-core/cli@4.10.2 http://127.0.0.1:4000/ \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --exit --save quality-reports/axe-home.json
          npx --yes @axe-core/cli@4.10.2 http://127.0.0.1:4000/articles/ \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --exit --save quality-reports/axe-articles.json
          npx --yes @axe-core/cli@4.10.2 http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --exit --save quality-reports/axe-article.json

      - name: Upload quality baseline reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quality-baseline-${{ github.event.pull_request.head.sha }}
          path: quality-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Verify repository-only files are not published
        run: |
          test ! -d _site/ReferenceDocument
          test ! -d _site/docs
          test ! -d _site/scripts
          test ! -d _site/tests
          test ! -d _site/_drafts
          test ! -d _site/_templates

      - name: Install Traditional Chinese screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-cache --force

      - name: Capture responsive article-template previews
        run: |
          python3 -m http.server 4000 --directory _site >/tmp/syuan-notes-preview.log 2>&1 &
          preview_server_pid=$!
          trap 'kill "$preview_server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/preview/article-template/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          mkdir -p visual-review
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=2048,2400 \
            --screenshot=visual-review/article-template-wide.png \
            http://127.0.0.1:4000/preview/article-template/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2400 \
            --screenshot=visual-review/article-template-desktop.png \
            http://127.0.0.1:4000/preview/article-template/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,3000 \
            --screenshot=visual-review/article-template-mobile.png \
            http://127.0.0.1:4000/preview/article-template/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2600 \
            --screenshot=visual-review/code-review-article-desktop.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,3200 \
            --screenshot=visual-review/code-review-article-mobile.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,3200 \
            --screenshot=visual-review/sql-merge-article-desktop.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,3600 \
            --screenshot=visual-review/sql-merge-article-mobile.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,7000 \
            --screenshot=visual-review/sql-merge-phrase-wrapping-desktop.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,12000 \
            --screenshot=visual-review/sql-merge-phrase-wrapping-mobile.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,5000 \
            --screenshot=visual-review/code-review-phrase-wrapping-desktop.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=2048,5000 \
            --screenshot=visual-review/code-review-phrase-wrapping-wide.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1638,5000 \
            --screenshot=visual-review/code-review-phrase-wrapping-zoom-125-equivalent.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1365,5000 \
            --screenshot=visual-review/code-review-phrase-wrapping-zoom-150-equivalent.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,9000 \
            --screenshot=visual-review/code-review-phrase-wrapping-mobile.png \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=2048,7000 \
            --screenshot=visual-review/sql-merge-phrase-wrapping-wide.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1638,7000 \
            --screenshot=visual-review/sql-merge-phrase-wrapping-zoom-125-equivalent.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1365,7000 \
            --screenshot=visual-review/sql-merge-phrase-wrapping-zoom-150-equivalent.png \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot=visual-review/home-desktop.png \
            http://127.0.0.1:4000/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,2400 \
            --screenshot=visual-review/home-mobile.png \
            http://127.0.0.1:4000/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot=visual-review/articles-desktop.png \
            http://127.0.0.1:4000/articles/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,2600 \
            --screenshot=visual-review/articles-mobile.png \
            http://127.0.0.1:4000/articles/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot=visual-review/category-code-desktop.png \
            http://127.0.0.1:4000/categories/code/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,2200 \
            --screenshot=visual-review/category-code-mobile.png \
            http://127.0.0.1:4000/categories/code/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot=visual-review/discovery-overview-desktop.png \
            http://127.0.0.1:4000/categories/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,2200 \
            --screenshot=visual-review/discovery-overview-mobile.png \
            http://127.0.0.1:4000/tags/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot=visual-review/archives-desktop.png \
            http://127.0.0.1:4000/archives/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,2200 \
            --screenshot=visual-review/archives-mobile.png \
            http://127.0.0.1:4000/archives/
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=1440,2200 \
            --screenshot=visual-review/search-review-desktop.png \
            'http://127.0.0.1:4000/search/?q=review'
          google-chrome --headless=new --no-sandbox --disable-gpu --force-dark-mode \
            --virtual-time-budget=5000 --window-size=390,2200 \
            --screenshot=visual-review/search-review-mobile.png \
            'http://127.0.0.1:4000/search/?q=review'
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:4000/2025/12/14/code-review-alignment-for-long-term-maintenance.html \
            > visual-review/code-review-dom.html
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:4000/2022/05/11/sql-server-merge.html \
            > visual-review/sql-merge-dom.html
          python3 scripts/verify_rendered_word_breaks.py \
            visual-review/code-review-dom.html \
            visual-review/sql-merge-dom.html

      - name: Verify browser search result
        run: |
          python3 -m http.server 4000 --directory _site >/tmp/syuan-notes-search.log 2>&1 &
          search_server_pid=$!
          trap 'kill "$search_server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/search/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom \
            'http://127.0.0.1:4000/search/?q=review' \
            | grep --fixed-strings 'Code Review 與 長期的維護討論'

      - name: Upload visual review screenshots
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visual-review-${{ github.event.pull_request.head.sha }}
          path: visual-review
          if-no-files-found: error
          retention-days: 1
