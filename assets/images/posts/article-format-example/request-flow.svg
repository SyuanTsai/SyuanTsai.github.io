<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">HTTP 請求處理流程</title>
  <desc id="description">Client 發送請求到 API，API 再呼叫下游服務，三個階段都記錄相同的 Correlation ID。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1673c9"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="24" fill="url(#background)" stroke="#b9d3ea" stroke-width="2"/>
  <text x="480" y="54" text-anchor="middle" fill="#17324a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Request diagnostics flow</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="112" width="220" height="132" rx="18" fill="#ffffff" stroke="#1673c9" stroke-width="3"/>
    <text x="180" y="165" fill="#17324a" font-size="26" font-weight="700">Client</text>
    <text x="180" y="202" fill="#52677b" font-size="18">Start time</text>

    <rect x="370" y="112" width="220" height="132" rx="18" fill="#ffffff" stroke="#1673c9" stroke-width="3"/>
    <text x="480" y="165" fill="#17324a" font-size="26" font-weight="700">API</text>
    <text x="480" y="202" fill="#52677b" font-size="18">Elapsed time</text>

    <rect x="670" y="112" width="220" height="132" rx="18" fill="#ffffff" stroke="#1673c9" stroke-width="3"/>
    <text x="780" y="165" fill="#17324a" font-size="26" font-weight="700">Dependency</text>
    <text x="780" y="202" fill="#52677b" font-size="18">Duration</text>

    <path d="M300 178 H350" stroke="#1673c9" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M600 178 H650" stroke="#1673c9" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="480" y="302" fill="#1673c9" font-size="20" font-weight="700">X-Correlation-ID</text>
  </g>
</svg>
